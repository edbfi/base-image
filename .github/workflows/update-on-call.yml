name: prepare-update
on:
  workflow_call:
    inputs:
      branch:
        type: string
        required: true
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false
          fetch-depth: 0
      - name: Refresh metadata in an isolated candidate
        env:
          BRANCH: ${{ inputs.branch }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          [[ "$BRANCH" =~ ^[a-z0-9][a-z0-9._-]{0,79}$ ]]
          test -f meta.json
          git switch -c "update/$BRANCH-$GITHUB_RUN_ID"
          bash build.sh update
          python3 -m json.tool meta.json >/dev/null
          git diff --exit-code -- . ':!meta.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add meta.json
          if git diff --cached --quiet; then
            echo 'Metadata is current.' > update-result.txt
          else
            git commit -s -m "chore(deps): refresh $BRANCH image metadata"
            git format-patch -1 --stdout > update.patch
            git bundle create update.bundle HEAD
            echo 'Review the retained patch, open a PR, and require full image CI before merge.' > update-result.txt
          fi
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: metadata-update-${{ inputs.branch }}
          path: |
            update-result.txt
            update.patch
            update.bundle
          retention-days: 7
          if-no-files-found: error
defaults:
  run:
    shell: bash
